services:
  - type: web
    name: earthsight
    env: python
    plan: free
    pythonVersion: "3.11.0"
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "PYTHONPATH=. uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.11.0"
