services:
  # FastAPI Backend & Frontend Web Service on Render (Free Tier)
  - type: web
    name: earthsight
    env: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && cd frontend && npm install && npm run build"
    startCommand: "PYTHONPATH=backend python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
